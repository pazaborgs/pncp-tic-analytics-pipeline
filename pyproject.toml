[project]
name = "pncp-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-storage>=3.17.1",
    "google-genai>=2.34.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[dependency-groups]
dbt = [
    "dbt-bigquery>=1.12.3",
]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
