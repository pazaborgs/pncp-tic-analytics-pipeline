version: 2

models:
  - name: stg_contratacoes
    description: "Camada Silver (Staging) de contratações públicas de Santos/SP deduplicadas, tipadas e padronizadas em snake_case."
    columns:
      - name: numero_controle_pncp
        description: "Identificador único global da contratação no PNCP."
        data_tests:
          - unique
          - not_null

      - name: orgao_cnpj
        description: "CNPJ do órgão ou entidade compradora."
        data_tests:
          - not_null

      - name: codigo_ibge
        description: "Código IBGE do município da unidade compradora (3548500 para Santos/SP)."
        data_tests:
          - not_null

      - name: modalidade_id
        description: "Código da modalidade de contratação conforme domínio do PNCP."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [4, 6, 8, 9, 12]
                quote: false

      - name: data_publicacao
        description: "Data de publicação da contratação no PNCP."
        data_tests:
          - not_null

      - name: _row_hash
        description: "Hash SHA-256 do payload original para controle de idempotência."
        data_tests:
          - not_null
